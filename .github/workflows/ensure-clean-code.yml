name: Ensure Clean Code

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/setup@v2

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @ictk/conformance exec playwright install --with-deps chromium

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      # Packs the three packages, installs the tarballs into fresh projects with
      # plain npm, and typechecks/builds/hydrates them — see packages/smoke.
      - run: pnpm smoke
