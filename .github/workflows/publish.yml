name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/setup@v2

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @ictk/conformance exec playwright install --with-deps chromium

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm smoke

      # Fixed versioning: all three packages release together at the tag's version.
      - run: node scripts/set-version.mjs "${GITHUB_REF_NAME#v}"

      - run: pnpm build

      # pnpm publishes in dependency order (core first) and swaps workspace:* for the exact version.
      - run: pnpm --filter "@tingard/*" publish --no-git-checks --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
