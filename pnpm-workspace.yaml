packages:
  - packages/*
  - examples/*

# Only these packages' install/postinstall scripts are allowed to run.
# Both are trusted toolchain deps whose postinstall just fetches a
# platform-specific native binary (no script runs for anything else).
allowBuilds:
  '@biomejs/biome': true
  esbuild: true

# Supply-chain hardening: refuse to install any dependency version
# published less than 14 days ago, so newly-published malicious
# releases have time to be caught and yanked before we can pull them in.
# 14 days * 24h * 60m = 20160 minutes.
minimumReleaseAge: 20160

# @testing-library/jest-dom/vitest imports `vitest` but doesn't declare it as
# a peer, so under pnpm's strict layout it can only find vitest if vitest is
# hoisted to the workspace root. Declaring the peer makes pnpm link the
# consuming package's own vitest into jest-dom's resolution context.
packageExtensions:
  '@testing-library/jest-dom':
    peerDependencies:
      vitest: '*'
